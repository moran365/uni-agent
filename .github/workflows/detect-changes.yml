name: Detect Changes
on:
  workflow_call:
    outputs:
      cpu:
        value: ${{ jobs.detect.outputs.cpu }}
      gpu:
        value: ${{ jobs.detect.outputs.gpu }}
      npu:
        value: ${{ jobs.detect.outputs.npu }}
      run_all:
        value: ${{ jobs.detect.outputs.run_all }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.filter.outputs.cpu }}
      gpu: ${{ steps.filter.outputs.gpu }}
      npu: ${{ steps.filter.outputs.npu }}
      run_all: ${{ steps.decision.outputs.run_all }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: tests/uni_agent/filter-paths.yml

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute run_all
        id: decision
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          RUN_ALL=false
          for f in $CHANGED; do
            case "$f" in 
              'examples/agent_aware_router/single-node.sh'|'tests/Case_Submission_Guide_CN.md') ;;
              *) RUN_ALL=true; break ;;
            esac
          done
          echo "run_all=$RUN_ALL" >> "$GITHUB_OUTPUT"
