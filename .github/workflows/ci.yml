name: Python Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============ Job 1: test in cpu ============
  test-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # tested in multi python version
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. set up python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 3. install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          
          git clone --branch v4.1.0 https://github.com/princeton-nlp/SWE-bench.git
          cd SWE-bench
          pip install -e .

      # 4. Test with pytest
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          pytest tests/ --cov=./ --cov-report=xml --cov-report=term

      - name: Upload CPU coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: cpu-tests-python${{ matrix.python-version }}

  # ============ Job 2: test in gpu ============
  test-gpu:
    runs-on: [ self-hosted, gpu ]
    timeout-minutes: 60

    # tested in multi python version
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. set up python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 3. install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

          git clone --branch v4.1.0 https://github.com/princeton-nlp/SWE-bench.git
          cd SWE-bench
          pip install -e .

      # 4. Test with pytest
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          pytest tests/ -m=gpu --cov=./ --cov-report=xml --cov-report=term

      - name: Upload GPU coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: gpu-tests

  # ============ Job 3: merge-coverage ============
  merge-coverage:
    needs: [ test-gpu, test-cpu ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          path: ./coverage-reports

      - name: Merge coverage reports
        run: |
          pip install coverage
          coverage combine ./coverage-reports/
          coverage xml -o ./merged-coverage.xml

      - name: Upload merged coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./merged-coverage.xml
          flags: merged